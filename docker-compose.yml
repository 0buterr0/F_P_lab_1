services:
  mysql:
    image: mysql:8.0
    container_name: dept-resources-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dept_resources
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
      TZ: Europe/Kyiv
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      # schema.sql виконується автоматично при ПЕРШОМУ запуску (порожній том)
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
